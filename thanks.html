<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信完了 | 新井製作所</title>
  <meta name="robots" content="noindex">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#1a1a1e;--surface:#22232a;--accent:#c8a84b;--text:#e8e8e8;--sub:#a0a0a8;--border:#3a3b45;}
    body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;max-width:560px;width:100%;padding:48px 32px;text-align:center;}
    .mark{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:16px;}
    p{color:var(--sub);font-size:0.95rem;margin-bottom:12px;}
    .btn{display:inline-block;margin-top:24px;background:var(--accent);color:#1a1a1e;text-decoration:none;font-weight:700;padding:14px 32px;border-radius:4px;transition:background .2s;}
    .btn:hover{background:#e0c060;}
    .tel{margin-top:28px;font-size:0.85rem;color:var(--sub);}
    .tel a{color:var(--accent);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>お問い合わせを送信しました</h1>
    <p>この度はお問い合わせいただき、ありがとうございます。</p>
    <p>内容を確認のうえ、担当者よりご連絡いたします。<br>お急ぎの場合はお電話でもお問い合わせください。</p>
    <p class="tel">TEL：<a href="tel:0774341075">(0774)34-1075</a>（平日 9:00〜17:00）</p>
    <a class="btn" href="https://araiss-kyoto.com/">トップページに戻る</a>
  </div>
</body>
</html>
